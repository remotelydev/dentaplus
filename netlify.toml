[build]
  command = "pnpm run generate"
  publish = ".output/public"

[build.environment]
  NITRO_PRESET = "static"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/zespol/michal-trzos"
  to = "/zespol/micha%C5%82-trzos/"
  status = 301

[[redirects]]
  from = "/zespol/michal-trzos/"
  to = "/zespol/micha%C5%82-trzos/"
  status = 301

[[redirects]]
  from = "/zespol/weronika-wlodarska"
  to = "/zespol/weronika-w%C5%82odarska/"
  status = 301

[[redirects]]
  from = "/zespol/weronika-wlodarska/"
  to = "/zespol/weronika-w%C5%82odarska/"
  status = 301

[[redirects]]
  from = "/zespol/monika-maciejeweska"
  to = "/zespol/monika-maciejewska/"
  status = 301

[[redirects]]
  from = "/zespol/monika-maciejeweska/"
  to = "/zespol/monika-maciejewska/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cdn.prismic.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https://www.google.com https://maps.google.com; connect-src 'self' https://*.cdn.prismic.io https://www.dentaplus.pl;"
